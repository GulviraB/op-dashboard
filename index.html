<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Мониторинг оперативного плана Института цифровых наук и искусственного интеллекта: 22 показателя, 6 кафедр, 1 полугодие 2026 года.">
<title>Оперплан ИЦН и ИИ по кафедрам</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --ink:#141821; --ink2:#434b5c; --muted:#6e7787;
  --paper:#f2f5f8; --surface:#ffffff; --surface2:#fafbfd;
  --line:#dde2e9; --line-strong:#c4ccd8;
  --accent:#1f45c8; --accent-soft:#e6ebfb;
  --ok:#0e7a5a; --ok-soft:#e2f3ec;
  --warn:#a8690b; --warn-soft:#fbf0dc;
  --risk:#b3352c; --risk-soft:#fbe6e4;
  --nd:#8a93a3; --nd-soft:#eceff4;
  --hm-ok:#1f9d55; --hm-warn:#eaa32a; --hm-low:#ef8a6f; --hm-zero:#d9453a; --hm-nd:#c7cdd6;
  --shadow:0 1px 2px rgba(20,24,33,.06), 0 8px 24px -16px rgba(20,24,33,.35);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#e8ecf3; --ink2:#a9b2c2; --muted:#7c8698;
    --paper:#0e1117; --surface:#161b24; --surface2:#1b212c;
    --line:#262d39; --line-strong:#39424f;
    --accent:#8ba3ff; --accent-soft:#1b2440;
    --ok:#46c79a; --ok-soft:#10261f;
    --warn:#e0a83e; --warn-soft:#2a2113;
    --risk:#f28077; --risk-soft:#2d1817;
    --nd:#7c8698; --nd-soft:#1e242e;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -18px rgba(0,0,0,.9);
  }
}
:root[data-theme="dark"]{
  --ink:#e8ecf3; --ink2:#a9b2c2; --muted:#7c8698;
  --paper:#0e1117; --surface:#161b24; --surface2:#1b212c;
  --line:#262d39; --line-strong:#39424f;
  --accent:#8ba3ff; --accent-soft:#1b2440;
  --ok:#46c79a; --ok-soft:#10261f;
  --warn:#e0a83e; --warn-soft:#2a2113;
  --risk:#f28077; --risk-soft:#2d1817;
  --nd:#7c8698; --nd-soft:#1e242e;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -18px rgba(0,0,0,.9);
}
:root{--c1:#3b5bdb; --c2:#0b7285; --c3:#7048e8; --c4:#c2255c; --c5:#e8590c; --c6:#5c940d}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--c1:#8da2fb; --c2:#3bc9db; --c3:#b197fc; --c4:#f783ac; --c5:#ffa94d; --c6:#a9e34b}}
:root[data-theme="dark"]{--c1:#8da2fb; --c2:#3bc9db; --c3:#b197fc; --c4:#f783ac; --c5:#ffa94d; --c6:#a9e34b}
.dept-dot{width:10px; height:10px; border-radius:3px; display:inline-block; margin-right:8px; vertical-align:-1px}
.doclink{display:inline-flex; width:22px; height:22px; border-radius:6px; color:#fff; font-size:11.5px;
  font-weight:700; align-items:center; justify-content:center; margin-right:4px; text-decoration:none}
.doclink:hover{filter:brightness(1.15)}
.doclink:focus-visible{outline:2px solid var(--ink); outline-offset:2px}
*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"IBM Plex Sans",-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:16.5px; line-height:1.58; -webkit-font-smoothing:antialiased;
}
.wrap{max-width:none; margin:0; padding-inline:26px; padding-block:0 56px}
h1,h2,h3{font-family:"Golos Text","IBM Plex Sans",sans-serif; margin:0; text-wrap:balance}
.num{font-family:"IBM Plex Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums}

/* ---------- каркас: боковая панель + рабочая область ---------- */
.shell{display:grid; grid-template-columns:304px minmax(0,1fr); min-height:100vh; align-items:start}
.side{position:sticky; top:0; align-self:start; max-height:100vh; overflow-y:auto; scrollbar-width:thin;
  background:var(--surface); border-right:1px solid var(--line); padding:16px 14px 20px}
.brand{display:flex; gap:11px; align-items:flex-start; padding:0 4px 13px; border-bottom:1px solid var(--line)}
.logo{width:42px; height:42px; flex:0 0 42px; border-radius:9px; background:var(--accent); color:#fff;
  display:grid; place-items:center; font-family:"Golos Text",sans-serif; font-weight:700; font-size:14px; letter-spacing:.02em}
.bname{font-family:"Golos Text",sans-serif; font-weight:700; font-size:16.5px; line-height:1.2}
.bsub{font-size:13.5px; color:var(--ink2); line-height:1.35; margin-top:2px}
.sgroup{font-size:11.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted);
  font-weight:700; padding:13px 4px 6px}
.snav{display:flex; flex-direction:column; gap:2px}
.sbox{border:1px solid var(--line); border-radius:11px; background:var(--card); padding:8px}
.tab{
  appearance:none; border:0; background:transparent; color:var(--ink2); cursor:pointer; text-align:left;
  font:inherit; font-weight:600; font-size:15px; padding:9px 11px; border-radius:8px;
  display:flex; gap:10px; align-items:center; line-height:1.3;
}
.tab .ic{color:var(--muted); font-size:14px; width:16px; text-align:center; flex:0 0 16px}
.tab{white-space:nowrap}
.tab:hover{background:var(--surface2); color:var(--ink)}
.tab[aria-selected="true"]{background:var(--accent-soft); color:var(--accent); box-shadow:inset 3px 0 0 var(--accent)}
.tab[aria-selected="true"] .ic{color:var(--accent)}
.tab:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.slegend{display:flex; flex-direction:column; gap:6px; padding:3px 4px}
.slegend span{display:flex; gap:9px; align-items:flex-start; font-size:14px; color:var(--ink2); line-height:1.3}
.slegend i{width:13px; height:13px; flex:0 0 13px; border-radius:3px; margin-top:3px}
.sref{display:flex; flex-direction:column; gap:4px; padding:3px 4px}
.srow{display:flex; gap:8px; align-items:center; justify-content:space-between;
  font-size:14px; color:var(--ink2); line-height:1.3}
.srow .lab{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.srow.total{margin-top:3px; padding:7px 9px; border-radius:7px;
  background:var(--accent-soft); color:var(--accent); font-weight:700}
.srow.total b{font-size:15.5px}
.srow .note{font-size:12.5px; color:var(--muted); padding-top:2px; line-height:1.35; white-space:normal}
input.refnum{width:72px; text-align:right; padding:4px 8px; font-family:"IBM Plex Mono",monospace;
  font-size:14.5px; font-variant-numeric:tabular-nums; flex:0 0 72px}
.sio{display:flex; flex-direction:column; gap:5px; padding:0 4px}
.sio .btn{width:100%; text-align:center}
.side .savebadge{padding:14px 11px 0}

/* ---------- шапка рабочей области ---------- */
.phead{position:sticky; top:0; z-index:20; display:flex; gap:18px; align-items:flex-start; flex-wrap:wrap;
  background:var(--accent); color:#fff; padding:16px 26px; border-radius:0}
.phead .eyebrow{font-size:11.5px; letter-spacing:.14em; text-transform:uppercase; color:rgba(255,255,255,.72); font-weight:700}
.phead h1{font-size:24px; font-weight:700; letter-spacing:-.01em; line-height:1.2; color:#fff; margin-top:2px}
.phead .subtitle{color:rgba(255,255,255,.82); font-size:14.5px; margin-top:3px}
.phead-right{margin-left:auto; display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.pbtn{appearance:none; font:inherit; font-size:13.5px; font-weight:600; cursor:pointer; color:#fff;
  background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.34); border-radius:8px; padding:7px 13px; white-space:nowrap}
.pbtn:hover{background:rgba(255,255,255,.24)}
.pdate{font-size:12.5px; color:rgba(255,255,255,.78); line-height:1.25; text-align:right}
.pdate b{display:block; color:#fff; font-size:14px}
.eyebrow{font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); font-weight:600}
h1{font-size:23px; font-weight:700; letter-spacing:-.01em; line-height:1.2}
.subtitle{color:var(--ink2); font-size:15px; margin-top:2px}
@media (max-width:980px){
  .shell{grid-template-columns:1fr}
  .side{position:static; height:auto; border-right:0; border-bottom:1px solid var(--line)}
  .snav{flex-direction:row; flex-wrap:wrap}
  .sio{flex-direction:row; flex-wrap:wrap}
  .sio .btn{width:auto}
}

.io{display:flex; gap:6px}
.btn{appearance:none; font:inherit; font-size:13.5px; font-weight:600; cursor:pointer;
  background:var(--surface); color:var(--ink2); border:1px solid var(--line-strong);
  border-radius:8px; padding:7px 12px; line-height:1.1; white-space:nowrap}
.btn:hover{border-color:var(--accent); color:var(--accent)}
.btn-main{background:var(--accent); border-color:var(--accent); color:#fff}
.btn-main:hover{background:var(--accent); border-color:var(--accent); color:#fff; filter:brightness(1.1)}
.btn:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.savebadge{font-size:13px; color:var(--muted); display:flex; align-items:center; gap:6px}
.dot{width:7px; height:7px; border-radius:50%; background:var(--ok)}
.dot.off{background:var(--warn)}

/* ---------- summary strip ---------- */
.strip{display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:1px; background:var(--line);
  border:1px solid var(--line); border-radius:12px; overflow:hidden; margin-top:20px;
  margin-right:auto}
.cell{background:var(--surface); padding:14px 16px;
  display:grid; grid-template-columns:minmax(0,1fr) auto; grid-template-areas:"k v" "s v";
  align-items:center; column-gap:14px}
.cell .k{grid-area:k}
.cell .s{grid-area:s}
.cell .k{font-size:12px; letter-spacing:.09em; text-transform:uppercase; color:var(--muted); font-weight:600}
.cell .v{grid-area:v; font-family:"Golos Text",sans-serif; font-size:32px; font-weight:700; line-height:1.1;
  margin-top:0; text-align:right; font-variant-numeric:tabular-nums}
.cell .s{font-size:13px; color:var(--muted); margin-top:2px}
.v.ok{color:var(--ok)} .v.warn{color:var(--warn)} .v.risk{color:var(--risk)} .v.nd{color:var(--nd)}

section{margin-top:30px}
.sec-head{display:flex; align-items:baseline; gap:12px; margin-bottom:12px; flex-wrap:wrap}
h2{font-size:17px; font-weight:700; letter-spacing:.01em}
.sec-note{font-size:13.5px; color:var(--muted)}

.panel{background:var(--surface); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow)}

/* ---------- block bars ---------- */
.blocks{display:grid; grid-template-columns:repeat(auto-fit,minmax(252px,1fr)); gap:12px}
.block{padding:14px; background:var(--surface); border:1px solid var(--line); border-radius:11px}
.block-top{display:flex; justify-content:space-between; align-items:baseline; gap:10px}
.block-name{font-family:"Golos Text",sans-serif; font-weight:700; font-size:15px; line-height:1.25}
.block-pct{font-family:"IBM Plex Mono",monospace; font-size:16.5px; font-weight:600; font-variant-numeric:tabular-nums}
.bar{height:7px; border-radius:4px; background:var(--nd-soft); margin-top:10px; overflow:hidden; display:flex}
.bar i{display:block; height:100%}
.bar i.ok{background:var(--ok)} .bar i.warn{background:var(--warn)} .bar i.risk{background:var(--risk)}
.legend{display:flex; gap:10px; font-size:12px; color:var(--muted); margin-top:9px; flex-wrap:nowrap; white-space:nowrap}
.legend span{display:flex; align-items:center; gap:4px; flex:0 0 auto}
.sw{width:9px; height:9px; border-radius:2px; display:inline-block}
.sw.ok{background:var(--ok)} .sw.warn{background:var(--warn)} .sw.risk{background:var(--risk)} .sw.nd{background:var(--nd)}

/* ---------- tables ---------- */
.scroll{overflow-x:auto; border-radius:12px}
table{border-collapse:separate; border-spacing:0; width:100%; min-width:760px; background:var(--surface)}
th,td{padding:11px 12px; text-align:left; border-bottom:1px solid var(--line); vertical-align:middle}
thead th{
  position:sticky; top:0; z-index:2; background:var(--surface2); font-size:12px; letter-spacing:.06em;
  text-transform:uppercase; color:var(--muted); font-weight:600; border-bottom:1px solid var(--line-strong); white-space:nowrap;
}
tbody tr:last-child td{border-bottom:0}
tr.blockrow td{
  background:var(--accent-soft); color:var(--accent); font-family:"Golos Text",sans-serif; font-weight:700;
  font-size:12.5px; letter-spacing:.08em; text-transform:uppercase; padding:9px 12px;
}
td.name{min-width:300px; max-width:520px; font-size:15.5px; line-height:1.45}
td.name .unit{color:var(--muted); font-size:12.5px}
td.n{text-align:left; font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums; white-space:nowrap}
.pill{display:inline-block; padding:3px 9px; border-radius:20px; font-size:12.5px; font-weight:600; white-space:nowrap}
.pill.ok{background:var(--ok-soft); color:var(--ok)}
.pill.warn{background:var(--warn-soft); color:var(--warn)}
.pill.risk{background:var(--risk-soft); color:var(--risk)}
.pill.nd{background:var(--nd-soft); color:var(--nd)}
.stripe{display:inline-block; width:3px; height:15px; border-radius:2px; margin-right:8px; vertical-align:-2px}
.stripe.ok{background:var(--ok)} .stripe.warn{background:var(--warn)} .stripe.risk{background:var(--risk)} .stripe.nd{background:var(--nd-soft)}

/* matrix */
table.matrix{min-width:1080px}
table.matrix th.dept{text-align:center; min-width:104px}
table.matrix td.cellv{text-align:center; padding:4px 5px}
.hmleg{display:flex; gap:18px; flex-wrap:wrap; align-items:center; margin:0 0 12px; font-size:14px; color:var(--ink2)}
.hmleg span{display:inline-flex; gap:7px; align-items:center}
.hmleg i.sw{width:28px; height:15px; border-radius:4px; display:inline-block}
.hm-ok{background:var(--hm-ok)}
.hm-warn{background:var(--hm-warn)}
.hm-low{background:var(--hm-low)}
.hm-zero{background:var(--hm-zero)}
.hm-nd{background:var(--hm-nd)}
input.cellinput{
  width:100%; min-width:64px; text-align:right; border:1px solid transparent; background:transparent;
  border-radius:6px; padding:5px 7px; color:var(--ink); font-family:"IBM Plex Mono",monospace;
  font-size:15.5px; font-variant-numeric:tabular-nums;
}
input.cellinput::placeholder{color:var(--nd)}
input.cellinput:hover{border-color:var(--line-strong); background:var(--surface2)}
input.cellinput:focus{outline:none; border-color:var(--accent); background:var(--surface2); box-shadow:0 0 0 3px var(--accent-soft)}
input.cellinput.filled{font-weight:600}
input.cellinput.hm{color:#fff; font-weight:700; text-align:center; border-color:transparent; border-radius:6px}
input.cellinput.hm-ok{background:var(--hm-ok)}
input.cellinput.hm-warn{background:var(--hm-warn)}
input.cellinput.hm-low{background:var(--hm-low)}
input.cellinput.hm-zero{background:var(--hm-zero)}
input.cellinput.hm-nd{background:var(--hm-nd)}
input.cellinput.hm::placeholder{color:rgba(255,255,255,.8)}
input.cellinput.hm.hm-nd{color:#4a5464}
input.cellinput.hm.hm-nd::placeholder{color:#4a5464}
input.cellinput.hm:hover{filter:brightness(1.08); border-color:transparent}
input.cellinput.hm:focus{outline:none; border-color:var(--ink); box-shadow:0 0 0 3px var(--accent-soft)}
td.total{text-align:left; font-family:"IBM Plex Mono",monospace; font-weight:600; background:var(--surface2); font-variant-numeric:tabular-nums}

/* ---------- entry view ---------- */
.entry-head{display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-bottom:14px}
select,input.txt{
  font:inherit; font-size:15.5px; color:var(--ink); background:var(--surface);
  border:1px solid var(--line-strong); border-radius:8px; padding:8px 11px;
}
select:focus,input.txt:focus{outline:2px solid var(--accent); outline-offset:1px}
.gf{display:grid; grid-template-columns:1fr 1fr; gap:4px}
.gf .numf{padding:6px 6px}
.gfout{grid-column:span 2; text-align:right; font-family:"IBM Plex Mono",monospace;
  font-size:12.5px; color:var(--ink2); font-variant-numeric:tabular-nums}
.entry-row{display:grid; grid-template-columns:1fr 100px 118px 110px 1fr; gap:10px; align-items:center;
  padding:11px 14px; border-bottom:1px solid var(--line)}
.entry-row:last-child{border-bottom:0}
.entry-row .note{display:grid; gap:6px}
.entry-row .lbl{font-size:15.5px; line-height:1.45}
.entry-row .lbl small{display:block; color:var(--muted); font-size:12.5px; margin-top:1px}
.entry-row input.txt{width:100%; padding:8px 10px; font-size:15.5px}
.entry-row input.numf{text-align:right; font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums}
.colhead{display:grid; grid-template-columns:1fr 100px 118px 110px 1fr; gap:10px; padding:8px 14px;
  font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); font-weight:600;
  border-bottom:1px solid var(--line-strong); background:var(--surface2); border-radius:12px 12px 0 0}
.colhead .r{text-align:right}

.deptbars{display:grid; gap:9px}
.deptbar{display:grid; grid-template-columns:minmax(180px,1fr) 1fr 104px; gap:12px; align-items:center; font-size:15.5px}
.deptbar .track{height:9px; background:var(--nd-soft); border-radius:5px; overflow:hidden}
.deptbar .track i{display:block; height:100%; background:var(--accent); border-radius:5px}
.deptbar .pc{text-align:right; font-family:"IBM Plex Mono",monospace; font-size:13.5px; font-variant-numeric:tabular-nums; color:var(--ink2)}

.foot{margin-top:34px; padding-top:16px; border-top:1px solid var(--line); color:var(--muted); font-size:13px}
.hint{background:var(--accent-soft); color:var(--accent); border-radius:10px; padding:11px 15px; font-size:13.5px; margin-bottom:14px}
.refline{margin:14px 0 0; padding:14px 16px; border:1px solid var(--line); border-radius:10px;
  background:var(--card); color:var(--ink2); font-size:14.5px; line-height:1.55}
.refline b{color:var(--ink)}
.refhead{font-family:"Golos Text",sans-serif; font-weight:700; font-size:15px; color:var(--ink); margin-bottom:10px}
.refhead span{font-family:inherit; font-weight:400; font-size:13.5px; color:var(--muted); margin-left:8px}
.refgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:8px}
.refitem{display:flex; gap:10px; align-items:center; justify-content:space-between;
  background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:7px 10px}
.refitem span{display:flex; gap:8px; align-items:center; font-size:14px}
.refitem i{width:11px; height:11px; border-radius:3px; flex:0 0 11px}
.refitem.total{background:var(--accent-soft); border-color:transparent; color:var(--accent); font-weight:600}
input.refnum{width:78px; text-align:right; padding:5px 8px; font-family:"IBM Plex Mono",monospace;
  font-size:14.5px; font-variant-numeric:tabular-nums}
.about{background:var(--surface); border:1px solid var(--line); border-left:3px solid var(--accent); border-radius:12px;
  padding:16px 18px; margin-top:30px; box-shadow:var(--shadow)}
.about h2{font-size:17px; margin-bottom:7px}
.about p{margin:0 0 9px; font-size:15.5px; color:var(--ink2); line-height:1.55; text-align:justify; text-justify:inter-word; hyphens:auto}
.about p:last-child{margin-bottom:0}
.about ol{margin:7px 0 0; padding-left:20px; font-size:15.5px; color:var(--ink2); line-height:1.6; text-align:justify; hyphens:auto}
.meta-line{display:flex; gap:8px 20px; flex-wrap:wrap; margin-top:12px; padding-top:11px; border-top:1px solid var(--line);
  font-size:13px; color:var(--muted)}
.meta-line b{color:var(--ink2); font-weight:600}
.banner{background:var(--warn-soft); color:var(--warn); border-radius:10px; padding:10px 14px; font-size:12.5px; margin-top:14px; font-weight:500}
.entry-row.inst,.colhead.inst{grid-template-columns:minmax(190px,1fr) 80px 80px 2.2fr 1.1fr; align-items:start}
.entry-row.inst .dash{color:var(--nd); text-align:center; padding-top:8px}
.calcwrap{display:grid; gap:5px}
.calcout{white-space:pre-line; font-size:13.5px; line-height:1.45; background:var(--surface2);
  border:1px solid var(--line); border-radius:8px; padding:7px 10px; color:var(--ink)}
.calcin{font-size:13px}
.calcrow{display:flex; gap:6px; align-items:center}
.calcrow .calcin{flex:1}
.btn.mini{padding:5px 10px; font-size:12px; white-space:nowrap}
@media (max-width:760px){

<script>
"use strict";

/* ================== СПРАВОЧНИКИ ================== */

const BLOCKS = [
  {id:"infra", name:"Инфраструктура и управление"},
  {id:"sci",   name:"Наука и инновации"},
  {id:"edu",   name:"Образовательные программы"},
  {id:"hr",    name:"Кадровый потенциал"},

];

/* unit: "pct" — доля, агрегируется как среднее; "cnt" — количество, суммируется */
const IND = [
  {id:"i01", b:"infra", n:"Создание Центра компетенций и переподготовки кадров в сфере IT", u:"cnt", um:"ед.", plan:1,  fact:null, note:"нет информации о выполнении"},
  {id:"i02", b:"infra", n:"Создание Комитета по биоэтике использования ИИ в научно-исследовательском и образовательном процессе", u:"cnt", um:"ед.", plan:1, fact:null, note:"нет информации о выполнении"},
  {id:"i03", b:"infra", n:"Создание диссертационного совета по ОП 8D06306 «Системы информационной безопасности»", u:"cnt", um:"ед.", plan:1, fact:1, note:"выполнено"},
  {id:"i04", b:"infra", n:"Переход от 6 кафедр к 5 кафедрам", u:"cnt", um:"кафедр", plan:5, fact:null, note:"информация о реализации не представлена"},

  {id:"i05", b:"sci", n:"Доля ППС, вовлечённых в НИР (участие в исследованиях и проектах)", u:"pct", um:"%", plan:77, fact:34.4, g:54, f:157, note:"54 из 157 ППС"},
  {id:"i06", b:"sci", n:"Услуги по НИР — количество научных проектов", u:"cnt", um:"проектов", plan:28, fact:14, note:"выполнение 50%"},
  {id:"i07", b:"sci", n:"Публикации в высокорейтинговых изданиях Q1, Q2", u:"cnt", um:"публикаций", plan:25, fact:null, note:"нет информации о выполнении"},
  {id:"i08", b:"sci", n:"Молодые ППС, занимающиеся научно-исследовательской работой", u:"cnt", um:"человек", plan:30, fact:22, note:"выполнение 73%"},
  {id:"i09", b:"sci", n:"Разработка прикладных проектов (прототипы, пилоты) для коммерциализации", u:"cnt", um:"ед.", plan:1, fact:1, note:"выполнено"},
  {id:"i10", b:"sci", n:"Меморандумы и соглашения с представителями крупного бизнеса", u:"cnt", um:"ед.", plan:1, fact:0, note:"не выполнено"},
  {id:"i11", b:"sci", n:"Доля проектов, финансируемых за счёт средств МИО и бизнеса", u:"pct", um:"%", plan:6, fact:18, note:"3 проекта, перевыполнено"},
  {id:"i12", b:"sci", n:"Договоры с промышленными и коммерческими партнёрами о внедрении разработок", u:"cnt", um:"договоров", plan:3, fact:3, note:"выполнено"},
  {id:"i13", b:"sci", n:"Патенты, акты внедрения, лицензионные соглашения, проданные патенты", u:"cnt", um:"ед.", plan:4, fact:9, note:"перевыполнено"},

  {id:"i14", b:"edu", n:"Доля актуализированных образовательных программ", u:"pct", um:"%", plan:20, fact:null, note:"нет информации о выполнении"},
  {id:"i15", b:"edu", n:"Доля трудоустройства выпускников", u:"pct", um:"%", plan:88, fact:null, note:"нет информации о выполнении"},
  {id:"i16", b:"edu", n:"Внедрение дуального обучения по образовательным программам", u:"cnt", um:"ОП", plan:2, fact:1, note:"ОП «Автоматизация и управление», 15 студентов"},
  {id:"i17", b:"edu", n:"Разработка новой ОП «Цифровая криминалистика» (7M06310)", u:"cnt", um:"ед.", plan:1, fact:1, note:"выполнено"},

  {id:"i18", b:"hr", n:"Доля остепенённых ППС", u:"pct", um:"%", plan:75, fact:77.1, g:121, f:157, note:"121 из 157 ППС"},
  {id:"i19", b:"hr", n:"Доля ППС, преподающих на английском языке", u:"pct", um:"%", plan:25, fact:24.8, g:39, f:157, note:"39 из 157 ППС"},

  {id:"i20", b:"intl", n:"Привлечённые зарубежные учёные", u:"cnt", um:"человек", plan:10, fact:null, note:"нет информации о выполнении"},
  {id:"i21", b:"intl", n:"Научные проекты в рамках международной коллаборации (межправсоглашения)", u:"cnt", um:"проектов", plan:4, fact:0, note:"не выполнено"},
  {id:"i22", b:"intl", n:"Учёные, прошедшие стажировку в ведущих научных центрах", u:"cnt", um:"человек", plan:11, fact:8, note:"выполнение 72%"}
];

const DEPTS = [
  {id:"d1", n:"Кафедра информатики",                        s:"Информатика"},
  {id:"d2", n:"Кафедра информационной безопасности",         s:"Инф. безопасность"},
  {id:"d3", n:"Кафедра информационных систем",               s:"Инф. системы"},
  {id:"d4", n:"Кафедра компьютерной и программной инженерии",s:"Комп. и прогр. инж."},
  {id:"d5", n:"Кафедра системного анализа и управления",     s:"Системный анализ"},
  {id:"d6", n:"Кафедра технологии искусственного интеллекта",s:"Технологии ИИ"}
];

/* ================== СОСТОЯНИЕ ================== */

/* Адрес веб-приложения Google Apps Script (общее хранилище).
   Пустая строка — дашборд работает только с локальным браузерным хранилищем. */
const API_URL = "";

let state = {};                // {deptId: {indId: {plan, fact, note, docs}}}
const INST = {id:"inst", n:"Институт — расчёт и сводный документ (SMART ENU)", s:"Институт"};
DEPTS.forEach(d => state[d.id] = {});
state[INST.id] = {};
let currentView = "inst";
let currentDept = DEPTS[0].id;
const pendingTimers = {};

function cellOf(deptId, indId){
  const d = state[deptId] || (state[deptId] = {});
  return d[indId] || (d[indId] = {});
}

/* ================== РАСЧЁТЫ ================== */

function statusOf(plan, fact){
  if (fact === null || fact === undefined || fact === "" || plan === null || plan === undefined) return "nd";
  if (!plan) return fact > 0 ? "ok" : "nd";
  const r = fact / plan;
  if (r >= 1) return "ok";
  if (r >= 0.5) return "warn";
  return "risk";
}
const STATUS_LABEL = {ok:"Выполнено", warn:"Частично", risk:"Риск", nd:"Нет данных"};

function fmt(v, unit){
  if (v === null || v === undefined || v === "") return "—";
  const n = Number(v);
  if (!isFinite(n)) return "—";
  if (unit === "pct") return String(Math.round(n)) + "%";
  return Math.abs(n % 1) > 0.0001 ? n.toFixed(1) : String(Math.round(n));
}
function pctOf(plan, fact, unit){
  if (fact === null || fact === undefined || fact === "" || !plan) return null;
  let p = Number(plan), f = Number(fact);
  if (unit === "pct"){ p = Math.round(p); f = Math.round(f); }
  if (!p) return null;
  return Math.min(100, Math.round((f / p) * 100));
}

/* агрегат по кафедрам для одного показателя */
/* штатный контингент ППС по кафедрам на 2026 г. (данные института) */
const DEPT_STAFF_DEFAULT = {d1:23, d2:34, d3:25, d4:24, d5:28, d6:21};
const STUDENTS_DEFAULT = 3201;
const CFG_KEY = "opplan-cfg";

/* контингент вносится вручную на вкладке «Обзор института» и хранится в браузере */
let CFG = {staff: Object.assign({}, DEPT_STAFF_DEFAULT), students: STUDENTS_DEFAULT};

function loadCfg(){
  try {
    const raw = localStorage.getItem(CFG_KEY);
    if (!raw) return;
    const d = JSON.parse(raw);
    if (d && d.staff) Object.keys(DEPT_STAFF_DEFAULT).forEach(k => {
      if (d.staff[k] !== undefined && d.staff[k] !== null) CFG.staff[k] = Number(d.staff[k]);
    });
    if (d && d.students !== undefined && d.students !== null) CFG.students = Number(d.students);
  } catch (e) {}
}

function saveCfg(){
  try { localStorage.setItem(CFG_KEY, JSON.stringify(CFG)); } catch (e) {}
}

loadCfg();

const DEPT_STAFF = CFG.staff;
/* показатели, знаменатель которых — штатный контингент ППС кафедры */
const STAFF_IND = ["i05","i18","i19"];
function staffTotal(){ return DEPTS.reduce((a,d) => a + (Number(DEPT_STAFF[d.id]) || 0), 0); }
/* контингент обучающихся института — см. CFG.students */

/* знаменатель F: то, что кафедра вписала, иначе её штатный контингент */
function denomOf(deptId, indId){
  const f = numOrNull(cellOf(deptId, indId).f);
  if (f) return f;
  if (STAFF_IND.indexOf(indId) >= 0 && DEPT_STAFF[deptId]) return DEPT_STAFF[deptId];
  return null;
}

function aggregate(ind){
  const facts = [], plans = [];
  let sg = 0, sf = 0, gfn = 0;
  DEPTS.forEach(d => {
    const c = cellOf(d.id, ind.id);
    if (c.fact !== undefined && c.fact !== null && c.fact !== "") facts.push(Number(c.fact));
    if (c.plan !== undefined && c.plan !== null && c.plan !== "") plans.push(Number(c.plan));
    const g = numOrNull(c.g), f = denomOf(d.id, ind.id);
    if (g !== null && f) { sg += g; sf += f; gfn++; }
  });
  const agg = (arr) => {
    if (!arr.length) return null;
    if (ind.u === "pct") return arr.reduce((a,b)=>a+b,0)/arr.length;
    return arr.reduce((a,b)=>a+b,0);
  };
  /* для долей правильная свёртка — сумма числителей на сумму знаменателей,
     а не среднее процентов по кафедрам */
  if (ind.u === "pct" && gfn)
    return {fact: sg / sf * 100, plan: agg(plans), filled: gfn, sg: sg, sf: sf, exact: true};
  return {fact: agg(facts), plan: agg(plans), filled: facts.length, sg: null, sf: null, exact: false};
}

function deptProgress(deptId){
  let done = 0, counted = 0;
  IND.forEach(ind => {
    const c = cellOf(deptId, ind.id);
    const plan = (c.plan === undefined || c.plan === null || c.plan === "") ? null : Number(c.plan);
    const fact = (c.fact === undefined || c.fact === null || c.fact === "") ? null : Number(c.fact);
    if (plan === null && fact === null) return;
    counted++;
    if (statusOf(plan === null ? ind.plan : plan, fact) === "ok") done++;
  });
  return {done, counted, pct: counted ? Math.round(done/counted*100) : 0};
}

function instTally(){
  const t = {ok:0, warn:0, risk:0, nd:0};
  IND.forEach(i => t[statusOf(i.plan, resolved(i).val)]++);
  return t;
}

/* ================== РЕНДЕР: ИНСТИТУТ ================== */

/* уточнённый факт: данные мониторинга института, дополненные сводкой по кафедрам */
function resolved(ind){
  const a = aggregate(ind);
  const iv = (ind.fact === null || ind.fact === undefined || ind.fact === "") ? null : Number(ind.fact);
  if (ind.u === "pct"){
    if (iv !== null) return {val: iv, src: "инст.", filled: a.filled};
    if (a.fact !== null) return {val: a.fact, src: "кафедры", filled: a.filled};
    return {val: null, src: "", filled: a.filled};
  }
  if (iv === null && a.fact === null) return {val: null, src: "", filled: a.filled};
  if (a.fact === null) return {val: iv, src: "инст.", filled: a.filled};
  if (iv === null || a.fact > iv) return {val: a.fact, src: "кафедры", filled: a.filled};
  return {val: iv, src: "инст.", filled: a.filled};
}

function renderInst(){
  const t = instTally();
  const total = IND.length;
  const perf = Math.round((t.ok / total) * 100);

  const about = `
  <div class="about">
    <h2>Что это за страница</h2>
    <p>Рабочий дашборд для мониторинга оперативного плана Института цифровых наук и искусственного интеллекта.
    Здесь собраны все 22 показателя оперплана с плановыми и фактическими значениями по итогам 1 полугодия 2026 года,
    а каждая из 6 кафедр вносит свои значения по тем же показателям — чтобы видеть вклад кафедр в общий результат
    института и точки риска до следующего отчётного периода.</p>
    <p><b>Как пользоваться:</b></p>
    <ol>
      <li><b>Институт</b> — сводная картина: сколько показателей выполнено, где риск, по каким нет данных.</li>
      <li><b>Матрица кафедр</b> — быстрый ввод факта по всем кафедрам сразу, итог по строке считается автоматически.</li>
      <li><b>Ввод по кафедре</b> — подробное заполнение: план кафедры, факт и комментарий по каждому показателю.</li>
    </ol>
    <div class="meta-line">
      <span>Автор: <b>Гульвира Бауыржановна</b></span>
      <span>Период: <b>оперативный план 2026, 1 полугодие</b></span>
      <span>Охват: <b>22 показателя · 6 кафедр</b></span>
      <span>Контингент: <b>155 ППС · 3201 обучающихся</b></span>
      <span>Статус: <b>заполняется</b></span>
    </div>
  </div>`;

  let html = `
  <div class="strip">
    <div class="cell"><div class="k">Показателей</div><div class="v">${total}</div><div class="s">оперплан 2026, 1 полугодие</div></div>
    <div class="cell"><div class="k">Выполнено</div><div class="v ok">${t.ok}</div><div class="s">${perf}% показателей</div></div>
    <div class="cell"><div class="k">Частично</div><div class="v warn">${t.warn}</div><div class="s">50–99% от плана</div></div>
    <div class="cell"><div class="k">Риск</div><div class="v risk">${t.risk}</div><div class="s">менее 50% от плана</div></div>
    <div class="cell"><div class="k">Нет данных</div><div class="v nd">${t.nd}</div><div class="s">ни институт, ни кафедры</div></div>
  </div>`;

  // блоки
  html += `<section><div class="sec-head"><h2>Выполнение по направлениям</h2>
    <span class="sec-note">доля показателей направления в каждом статусе</span></div><div class="blocks">`;
  BLOCKS.forEach(b => {
    const list = IND.filter(i => i.b === b.id);
    const c = {ok:0,warn:0,risk:0,nd:0};
    list.forEach(i => c[statusOf(i.plan, resolved(i).val)]++);
    const p = n => (n/list.length*100).toFixed(1) + "%";
    html += `<div class="block">
      <div class="block-top"><span class="block-name">${b.name}</span>
      <span class="block-pct" style="color:var(--${c.ok/list.length>=0.6?'ok':c.ok/list.length>=0.3?'warn':'risk'})">${Math.round(c.ok/list.length*100)}%</span></div>
      <div class="bar">
        <i class="ok" style="width:${p(c.ok)}"></i><i class="warn" style="width:${p(c.warn)}"></i><i class="risk" style="width:${p(c.risk)}"></i>
      </div>
      <div class="legend">
        <span><i class="sw ok"></i>${c.ok} выполнено</span>
        <span><i class="sw warn"></i>${c.warn} частично</span>
        <span><i class="sw risk"></i>${c.risk} риск</span>
        <span><i class="sw nd"></i>${c.nd} нет данных</span>
      </div></div>`;
  });
  html += `</div></section>`;

  // прогресс заполнения по кафедрам
  html += `<section><div class="sec-head"><h2>Заполнение данных по кафедрам</h2>
    <span class="sec-note">доля показателей со статусом «выполнено» среди заполненных</span></div>
    <div class="panel" style="padding:16px"><div class="deptbars">`;
  DEPTS.forEach((d, di) => {
    const p = deptProgress(d.id);
    const col = "var(--c" + (di + 1) + ")";
    html += `<div class="deptbar">
      <span><i class="dept-dot" style="background:${col}"></i>${d.n}</span>
      <span class="track"><i style="width:${p.pct}%; background:${col}"></i></span>
      <span class="pc">${p.counted ? p.done + "/" + p.counted + " · " + p.pct + "%" : "—"}</span>
    </div>`;
  });
  html += `</div></div></section>`;

  // таблица показателей института
  html += `<section><div class="sec-head"><h2>Показатели оперативного плана</h2></div>
    <div class="panel scroll"><table><thead><tr>
      <th>Показатель</th><th>План</th><th>Факт мониторинга</th>
      <th>Кафедры</th>
      <th>%</th><th>Статус</th><th>Документы</th><th>Комментарий</th>
    </tr></thead><tbody>`;
  BLOCKS.forEach(b => {
    html += `<tr class="blockrow"><td colspan="8">${b.name}</td></tr>`;
    IND.filter(i => i.b === b.id).forEach(i => {
      const r = resolved(i);
      const st = statusOf(i.plan, r.val);
      const pc = pctOf(i.plan, r.val, i.u);
      const a = aggregate(i);
      html += `<tr>
        <td class="name"><span class="stripe ${st}"></span>${i.n} <span class="unit">(${i.um})</span></td>
        <td class="n">${fmt(i.plan, i.u)}</td>
        <td class="n" style="color:var(--muted)">${fmt(i.fact, i.u)}</td>
        <td class="n" style="color:var(--${a.fact===null?'nd':'accent'})">${a.fact === null ? "—" : fmt(a.fact, i.u) + " <span style=\"color:var(--muted);font-size:12px\">" + (i.u === "pct" ? "сред. /" : "/") + a.filled + " каф.</span>"}</td>
        <td class="n">${pc === null ? "—" : pc + "%"}</td>
        <td><span class="pill ${st}">${STATUS_LABEL[st]}</span></td>

/* тепловая карта: балл выполнения кафедры по показателю */
function hmScore(ind, deptId){
  const c = cellOf(deptId, ind.id);
  if (c.fact === undefined || c.fact === null || c.fact === "") return null;
  const plan = (c.plan === undefined || c.plan === null) ? ind.plan : c.plan;
  return pctOf(plan, c.fact, ind.u);
}

/* значение есть — зелёный, ноль — красный, пусто — серый */
function hmClass(ind, deptId){
  const c = cellOf(deptId, ind.id);
  const v = numOrNull(c.fact);
  if (v === null) return "hm hm-nd";
  return v > 0 ? "hm hm-ok" : "hm hm-zero";
}

function hmTitle(ind, dept){
  const c = cellOf(dept.id, ind.id);
  const sc = hmScore(ind, dept.id);
  const plan = (c.plan === undefined || c.plan === null) ? ind.plan : c.plan;
  return ind.n + "\n" + dept.n +
    "\nФакт: " + (c.fact === null || c.fact === undefined || c.fact === "" ? "нет данных" : fmt(c.fact, ind.u)) +
    "\nОриентир: " + fmt(plan, ind.u) +
    "\nБалл: " + (sc === null ? "—" : sc);
}

  <div class="hmleg">

const LS_KEY = "idsai_op_2026_v1";
const dirty = new Set();

function setSaveState(kind, text){
  document.getElementById("savedot").className = "dot" + (kind === "off" ? " off" : "");
  document.getElementById("savetext").textContent = text;
}

function persist(){
  try { localStorage.setItem(LS_KEY, JSON.stringify({savedAt: new Date().toISOString(), state: state})); } catch (e) {}
  if (!API_URL){ setSaveState("on", "сохранено в браузере"); dirty.clear(); return; }
  const ids = dirty.size ? Array.from(dirty) : DEPTS.map(d => d.id).concat([INST.id]);
  const depts = {};
  ids.forEach(id => depts[id] = state[id] || {});
  fetch(API_URL, {method: "POST", headers: {"Content-Type": "text/plain;charset=utf-8"},
                  body: JSON.stringify({action: "save", depts: depts})})
    .then(r => r.json())
    .then(r => {
      if (r && r.ok){ dirty.clear(); setSaveState("on", "сохранено для всех"); }
      else setSaveState("off", "ошибка сохранения");
    })
    .catch(() => setSaveState("off", "нет связи с хранилищем"));
}

function queueSave(deptId){
  if (deptId) dirty.add(deptId);
  clearTimeout(pendingTimers.all);
  setSaveState("on", "сохранение…");
  pendingTimers.all = setTimeout(persist, 700);
}

function loadLocal(){
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return false;
    const data = JSON.parse(raw);
    if (!data || !data.state) return false;
    [INST].concat(DEPTS).forEach(d => { if (data.state[d.id]) state[d.id] = data.state[d.id]; });
    return true;
  } catch (e) { return false; }
}

async function loadRemote(){
  if (!API_URL) return false;
  try {
    const url = API_URL + (API_URL.indexOf("?") < 0 ? "?" : "&") + "t=" + Date.now();
    const data = await (await fetch(url)).json();
    if (!data || !data.ok || !data.state) return false;
    [INST].concat(DEPTS).forEach(d => { if (data.state[d.id]) state[d.id] = data.state[d.id]; });
    return true;
  } catch (e) { return false; }
}

           '<td class="c">' + (a.fact === null ? "—" : fmt(a.fact, i.u) + (i.u === "pct" ? " сред. / " : " / ") + a.filled + " каф.") + '</td>' +
           '<td class="c"><b>' + fmt(r.val, i.u) + '</b>' + (r.src === "кафедры" ? " (каф.)" : "") + '</td>' +
           '<td class="c">' + (pc === null ? "—" : pc + "%") + '</td>' +
           '<td class="c">' + STATUS_LABEL[st] + '</td>' +
           '<td class="c">' + (links.length ? "каф. " + links.join(", ") : "—") + '</td>' +
           '<td>' + esc(i.note) + '</td></tr>';
    });
  });
  h += '</table>';

  h += '<p style="margin-top:16pt; font-size:9pt">Нумерация кафедр в колонке «Документы»: ' +
       DEPTS.map((d, di) => (di + 1) + " — " + esc(d.n)).join('; ') + '.</p>';

  downloadFile("\ufeff" + h, "Отчёт-оперплан-ИЦН-" + new Date().toISOString().slice(0,10) + ".doc", "application/msword");
}

/* ---- расчёт доли для отчёта SMART ENU ---- */

const PCTL = {
  i05: {num:"Штатных ППС, вовлечённых в НИР", den:"Всего штатных ППС", u:"чел."},
  i11: {num:"Проектов, финансируемых за счёт средств МИО и бизнеса", den:"Всего научных проектов", u:"ед.", denFrom:"i06"},
  i14: {num:"Актуализированных образовательных программ", den:"Всего образовательных программ", u:"ед."},
  i15: {num:"Трудоустроенных выпускников", den:"Всего выпускников", u:"чел."},
  i18: {num:"Штатных ППС со степенью", den:"Всего штатных ППС", u:"чел."},
  i19: {num:"ППС, преподающих на английском языке", den:"Всего штатных ППС", u:"чел."}
};

function numOrNull(v){
  if (v === null || v === undefined || v === "") return null;
  const n = Number(v);
  return isFinite(n) ? n : null;
}

/* знаменатель свода: для кадровых показателей — всего штатных ППС института,
   для остальных долей — вписанный вручную либо взятый из связанного показателя */
function instDenom(ind){
  const f = numOrNull(cellOf(INST.id, ind.id).f);
  if (f) return f;
  if (STAFF_IND.indexOf(ind.id) >= 0) return staffTotal();
  const L = PCTL[ind.id];
  if (L && L.denFrom){
    const base = IND.find(x => x.id === L.denFrom);
    if (base){ const rv = resolved(base).val; if (rv) return Number(rv); }
  }
  return null;
}

/* числитель свода: вписанный по институту, иначе сумма количеств по кафедрам */
function instNumer(ind){
  const g = numOrNull(cellOf(INST.id, ind.id).g);
  if (g !== null) return g;
  let sg = 0, n = 0;
  DEPTS.forEach(d => {
    const v = numOrNull(cellOf(d.id, ind.id).g);
    if (v !== null){ sg += v; n++; }
  });
  return n ? sg : null;
}

function gfOf(ind){
  const g = instNumer(ind), f = instDenom(ind);
  if (g !== null && f) return {g: g, f: f, src: "свод"};
  const mg = numOrNull(ind.g), mf = numOrNull(ind.f);
  if (mg !== null && mf) return {g: mg, f: mf, src: "мониторинг"};
  return null;
}

function calcText(ind){
  const c = cellOf(INST.id, ind.id);
  if (c.calc && c.calc.trim()) return c.calc.trim();
  if (ind.u === "pct"){
    const L = PCTL[ind.id] || {num: ind.n, den: "Всего", u: "ед."};
    const gf = gfOf(ind);
    if (!gf) return "";
    const ps = (gf.g / gf.f * 100).toFixed(1).replace(".", ",");
    return L.num + " - " + gf.g + " " + L.u + "\n" +
           L.den + " - " + gf.f + " " + L.u + "\n" +
           "H = G ÷ F × 100 = " + gf.g + " ÷ " + gf.f + " × 100 = " + ps + "%";
  }
  const r = resolved(ind);
  if (r.val === null) return "";
  const parts = [];
  DEPTS.forEach(d => {
    const v = numOrNull(cellOf(d.id, ind.id).fact);
    if (v !== null) parts.push({s: d.s, v: v});
  });
  const sum = parts.reduce((a, b) => a + b.v, 0);
  const dot = (x) => /\.$/.test(x) ? x : x + ".";
  let t = dot(ind.n + " - " + fmt(r.val, ind.u) + " " + ind.um);
  if (parts.length > 1 && r.src === "кафедры" && sum === Number(r.val)){
    t += "\n" + parts.map(x => x.s + " - " + x.v).join("; ") + "." +
         "\nH = " + dot(parts.map(x => x.v).join(" + ") + " = " + sum + " " + ind.um);
  }
  return t;
}

function exportSmart(){
  let h = '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">';
  h += '<head><meta charset="utf-8"><title>SMART ENU</title><style>';
  h += '@page{size:A4 landscape; margin:1.2cm}';
  h += 'body{font-family:"Times New Roman",serif; font-size:11pt}';
  h += 'h1{font-size:13pt; text-align:center; margin:0 0 4pt}';
  h += 'p.sub{text-align:center; font-size:11pt; margin:0 0 10pt}';
  h += 'table{border-collapse:collapse; width:100%; font-size:8.5pt}';
  h += 'th,td{border:1px solid #000; padding:3pt 4pt; vertical-align:top}';
  h += 'th{background:#e6ebfb; font-weight:bold; text-align:center; font-size:8pt}';
  h += 'td.c{text-align:center; white-space:nowrap}';
  h += 'tr.blk td{background:#f2f5f8; font-weight:bold; text-transform:uppercase; font-size:8pt}';
  h += '</style></head><body>';

  h += '<h1>SMART ENU · Выполнение оперативного плана за 1 полугодие 2026 года</h1>';
  h += '<p class="sub">Институт цифровых наук и искусственного интеллекта · ' + esc(ruDate()) + '</p>';
  h += '<p class="sub">Штатный контингент ППС — ' + staffTotal() + ' чел. · контингент обучающихся — ' + (CFG.students == null ? "—" : CFG.students) + ' чел.</p>';

  h += '<table><tr><th style="width:30%">Показатель</th><th style="width:8%">План</th>' +
       '<th style="width:40%">Результат</th>' +
       '<th style="width:22%">Подтверждающий документ</th></tr>';

  BLOCKS.forEach(b => {
    const list = IND.filter(i => i.b === b.id);
    if (!list.length) return;
    h += '<tr class="blk"><td colspan="4">' + esc(b.name) + '</td></tr>';
    list.forEach(i => {
      const ic = cellOf(INST.id, i.id);
      const calc = calcText(i) ||
        (i.u === "pct" ? "Укажите G (количество) и F (всего) во вкладке «Институт» — формула соберётся сама"
                       : (i.note || "—"));
      let doc = (ic.docs && ic.docs.trim()) ? ic.docs : "";
      if (!doc){
        const links = DEPTS.map(d => cellOf(d.id, i.id).docs).filter(x => x && x.trim());
        doc = links.length ? links.join("  ") : "";
      }
      h += '<tr><td>' + esc(i.n) + ' <i>(' + esc(i.um) + ')</i></td>' +
           '<td class="c">' + fmt(i.plan, i.u) + '</td>' +
           '<td>' + esc(calc).replace(/\n/g, "<br>") + '</td>' +
           '<td>' + (doc ? '<a href="' + esc(doc) + '">' + esc(doc) + '</a>' : "—") + '</td></tr>';
    });
  });
  h += '</table>';

  downloadFile("﻿" + h, "SMART-ENU-оперплан-ИЦН-" + new Date().toISOString().slice(0,10) + ".doc", "application/msword");
}

function downloadFile(text, filename, type){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], {type: type + ";charset=utf-8"}));
  a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

function importJSON(file){
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const data = JSON.parse(fr.result);
      const incoming = data && data.state ? data.state : null;
      if (!incoming) throw new Error("нет данных");
      let merged = 0;
      DEPTS.forEach(d => {
        const src = incoming[d.id];
        if (!src) return;
        Object.keys(src).forEach(k => {
          const c = src[k];
          if (!c) return;
          if (c.plan != null || c.fact != null || (c.note && c.note.length) || (c.docs && c.docs.length)) { state[d.id][k] = Object.assign({}, c); merged++; }
        });
      });
      DEPTS.forEach(d => dirty.add(d.id));
      persist(); render();
      setSaveState("on", "загружено значений: " + merged);
    } catch (e) {
      setSaveState("off", "файл не распознан");
    }
  };
  fr.readAsText(file);
}

async function boot(){
  loadLocal();
  render();
  if (API_URL) setSaveState("on", "загрузка данных…");
  const remote = await loadRemote();
  setSaveState(API_URL && !remote ? "off" : "on",
    !API_URL ? "данные сохраняются в браузере"
             : (remote ? "общее хранилище подключено" : "нет связи с хранилищем"));
  render();
  document.getElementById("foot").innerHTML = "";
}

function render(){
  renderInst();
  if (currentView === "matrix") renderMatrix();
  if (currentView === "entry") renderEntry();
}

const VIEW_HEAD = {
  inst:   ["Обзор института", "Сводная картина выполнения оперативного плана 2026"],
  matrix: ["Кафедры и показатели", "Тепловая карта: зелёный — показатель есть, красный — 0, серый — нет данных"],
  entry:  ["Ввод данных", "План, факт, комментарий и подтверждающие документы по каждому показателю"]
};

function setHead(v){
  const h = VIEW_HEAD[v] || VIEW_HEAD.inst;
  document.getElementById("phead-title").textContent = h[0];
  document.getElementById("phead-sub").textContent = h[1];
}

function renderSideLegend(){
  const el = document.getElementById("slegend");
  if (!el) return;
  el.innerHTML = DEPTS.map((d, di) =>
    `<span title="${d.n}"><i style="background:var(--c${di + 1})"></i>${d.s}</span>`).join("");
}

/* контингент: вносится вручную в боковой панели, служит знаменателем F */
function renderSideCfg(){
  const el = document.getElementById("sref");
  if (!el) return;
  el.innerHTML =
    DEPTS.map(d => `<div class="srow"><span class="lab" title="${d.n}">${d.s}</span>
      <input class="txt refnum" id="cfg_${d.id}" inputmode="numeric" value="${DEPT_STAFF[d.id] == null ? "" : DEPT_STAFF[d.id]}" aria-label="Штатных ППС: ${d.n}"></div>`).join("") +
    `<div class="srow total"><span class="lab">Всего ППС</span><b class="num" id="cfg_total">${staffTotal()}</b></div>` +
    `<div class="srow"><span class="lab">Обучающихся</span>
      <input class="txt refnum" id="cfg_students" inputmode="numeric" value="${CFG.students == null ? "" : CFG.students}" aria-label="Контингент обучающихся"></div>`;

  DEPTS.forEach(d => {
    const inp = document.getElementById("cfg_" + d.id);
    if (!inp) return;
    inp.addEventListener("input", () => {
      const v = numOrNull(inp.value.replace(",", ".").trim());
      DEPT_STAFF[d.id] = v === null ? 0 : v;
      const t = document.getElementById("cfg_total");
      if (t) t.textContent = staffTotal();
      saveCfg();
      render();
    });
  });
  const stEl = document.getElementById("cfg_students");
  if (stEl) stEl.addEventListener("input", () => {
    CFG.students = numOrNull(stEl.value.replace(",", ".").trim());
    saveCfg();
  });
}

document.querySelectorAll(".tab").forEach(t => {
  t.addEventListener("click", () => {
    currentView = t.dataset.view;
    document.querySelectorAll(".tab").forEach(x => x.setAttribute("aria-selected", String(x === t)));
    ["inst","matrix","entry"].forEach(v => document.getElementById("view-" + v).hidden = (v !== currentView));
    setHead(currentView);
    if (currentView === "inst") renderInst();
    if (currentView === "matrix") renderMatrix();
    if (currentView === "entry") renderEntry();
  });
});

renderSideLegend();
renderSideCfg();
document.getElementById("pdate").textContent = ruDate().replace(" г.", "");

document.getElementById("btn-report").addEventListener("click", exportReport);
document.getElementById("btn-smart").addEventListener("click", exportSmart);
document.getElementById("btn-export").addEventListener("click", exportJSON);
/* кнопка CSV убрана по просьбе автора; функция exportCSV оставлена на будущее */
document.getElementById("file-import").addEventListener("change", e => {
  if (e.target.files && e.target.files[0]) importJSON(e.target.files[0]);
  e.target.value = "";
});

boot();
